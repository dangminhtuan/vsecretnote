<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeCypher Rhyme & Tone Matrix</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/snk.css" />
  <style>
    body { padding: 10px 8px; font-family: monospace; background: #000; color: #0f0; margin: 0; }
    .matrix-container { max-width: 1000px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: nowrap; gap: 6px; }
    .nav-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .control-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .search-box { flex: 1; min-width: 140px; background: #000; color: #0f0; border: 1px solid #0f0; padding: 4px 8px; font-family: monospace; font-size: 12px; box-sizing: border-box; }
    .search-box::placeholder { color: #050; }
    .stat-text { color: #888; font-size: 11px; white-space: nowrap; }

    .legend-bar { display: flex; gap: 10px; align-items: center; font-size: 11px; margin-bottom: 8px; color: #888; }
    .legend-badge { padding: 0 4px; border-radius: 2px; font-family: monospace; font-weight: bold; }

    .table-wrapper { width: 100%; border: 1px solid #333; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th { border: 1px solid #333; padding: 6px 1px; text-align: center; background: #111; color: #0f0; font-size: 13px; font-weight: bold; }
    td { border: 1px solid #222; padding: 3px 1px; text-align: center; font-size: 11px; vertical-align: middle; }
    tr:nth-child(even) td { background: #050505; }
    tr:hover td { background: #0d1a0d; }

    /* Column width distribution */
    th:nth-child(1), td:nth-child(1) { width: 28px; color: #555; font-size: 10px; }
    th:nth-child(2), td:nth-child(2) { width: 44px; font-weight: bold; color: #fff; border-right: 1px solid #0f0; }

    /* Code badges */
    .cell-codes { display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center; }
    .code-badge {
      display: block;
      width: 100%;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 1px 0;
      border-radius: 2px;
      text-decoration: none;
      text-align: center;
      line-height: 1.2;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .code-badge.base-p {
      color: #0f0;
      background: #001a00;
      border: 1px solid #004400;
    }
    .code-badge.base-p:hover {
      color: #fff;
      background: #004400;
      border-color: #0f0;
      box-shadow: 0 0 6px #0f0;
    }
    .code-badge.extra-p {
      color: #0ff;
      background: #00151a;
      border: 1px solid #004455;
    }
    .code-badge.extra-p:hover {
      color: #fff;
      background: #004455;
      border-color: #0ff;
      box-shadow: 0 0 6px #0ff;
    }
    .code-badge.disabled-code {
      color: #333;
      background: #050505;
      border: 1px solid #111;
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
      user-select: none;
    }

    @media (max-width: 768px) {
      body { padding: 6px 4px; }
      h1.glitch { font-size: 18px; }
      .code-badge { font-size: 10px; letter-spacing: -0.5px; }
      th { font-size: 12px; padding: 4px 0; }
      th:nth-child(1), td:nth-child(1) { width: 24px; }
      th:nth-child(2), td:nth-child(2) { width: 38px; }
    }
  </style>
</head>
<body>
  <div class="matrix-container">
    <header>
      <div>
        <h1 class="glitch" data-text="RHYME MATRIX" style="margin: 0; font-size: 20px;">RHYME MATRIX</h1>
      </div>
      <div class="nav-actions">
        <a href="/" class="cyber-btn" style="text-decoration:none; padding: 3px 8px; font-size: 11px;">&larr; APP</a>
        <a href="/dict.html" class="cyber-btn" style="text-decoration:none; padding: 3px 8px; font-size: 11px; color: #0ff; border-color: #0ff;">📖 DICT</a>
      </div>
    </header>

    <div class="control-bar">
      <input type="text" id="search-rhyme" class="search-box" placeholder="Tìm vần..." autocomplete="off" spellcheck="false" />
      <div class="stat-text" id="stat-text">Đang tải...</div>
    </div>

    <div class="legend-bar">
      <span><span class="legend-badge" style="background:#001a00; color:#0f0; border:1px solid #004400;">c...</span> = PA chính</span>
      <span>|</span>
      <span><span class="legend-badge" style="background:#00151a; color:#0ff; border:1px solid #004455;">t...</span> = PA phụ</span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>STT</th>
            <th>Vần</th>
            <th title="Dấu Bằng (=)">=</th>
            <th title="Dấu Sắc (✓)">✓</th>
            <th title="Dấu Huyền (`)">`</th>
            <th title="Dấu Hỏi (ˀ)">ˀ</th>
            <th title="Dấu Ngã (~)">~</th>
            <th title="Dấu Nặng (•)">•</th>
          </tr>
        </thead>
        <tbody id="matrix-tbody">
          <!-- Rendered via matrix.js -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/matrix.js"></script>
</body>
</html>
