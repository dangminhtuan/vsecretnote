
<!DOCTYPE html>
<html>
<body style="background:#010409; padding:20px;">
  <h2 style="color:#00f2fe; font-family:sans-serif;">So Sánh Ký Tự B & Từ "thấy" (TB1)</h2>
  
  <div style="display:inline-block; margin:15px; text-align:center; color:#fff; font-family:sans-serif;">
    <div style="font-size:14px; margin-bottom:8px;">B Cũ (Bị bẹp dí, 2 bụng dính vào nhau)</div>
    <svg viewBox="0 0 100 100" width="120" height="120" stroke="#00f2fe" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" style="background:#090d14; border:1px solid #1e3a5f; border-radius:8px;">
      <!-- Left: T -->
      <g transform="translate(0, 10) scale(0.55)">
        <line x1="22" y1="24" x2="78" y2="24" /><line x1="50" y1="24" x2="50" y2="78" />
      </g>
      <!-- Top-Right: 1 -->
      <g transform="translate(50, 0) scale(0.48)">
        <polyline points="36,36 50,22 50,80" fill="none" />
      </g>
      <!-- Bottom-Right: B -->
      <g transform="translate(50, 50) scale(0.48)">
        <line x1="32" y1="22" x2="32" y2="78" /><path d="M 32 22 A 16 16 0 0 1 32 50 A 16 16 0 0 1 32 78" fill="none" />
      </g>
    </svg>
    <div style="margin-top:8px;">
      <svg viewBox="0 0 100 100" width="60" height="60" stroke="#00f2fe" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" style="background:#090d14; border:1px solid #1e3a5f; border-radius:6px;">

      </svg>
      <div style="font-size:11px; color:#888;">Ký tự đơn B</div>
    </div>
  </div>
  
  <div style="display:inline-block; margin:15px; text-align:center; color:#fff; font-family:sans-serif;">

    <svg viewBox="0 0 100 100" width="120" height="120" stroke="#00f2fe" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" style="background:#090d14; border:1px solid #1e3a5f; border-radius:8px;">
      <!-- Left: T -->

      <g transform="translate(50, 50) scale(0.48)">
        <line x1="28" y1="22" x2="28" y2="78" /><path d="M 28 22 L 50 22 A 14 14 0 0 1 50 50 L 28 50" fill="none" /><path d="M 28 50 L 52 50 A 14 14 0 0 1 52 78 L 28 78" fill="none" />
