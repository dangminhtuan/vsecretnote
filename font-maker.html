<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Vietnamese Font Maker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    @font-face {
      font-family: 'CyberVietnamese';
      src: url('/CyberVietnamese-Regular.ttf?v=4') format('truetype');
    }
    body {
      background: #0d1117; color: #c9d1d9;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      margin: 0; padding: 10px 8px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    h1  { color: #58a6ff; margin: 0 0 4px; font-size: 16px; text-align: center; }
    p   { color: #8b949e; margin: 0 0 10px; font-size: 11px; text-align: center; }

    /* Bố cục 1 khối duy nhất */
    .variant {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; padding: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      margin-bottom: 10px;
      width: 100%; max-width: 380px;
    }

    svg.canvas {
      background: #000; border: 1px solid #30363d;
      box-shadow: 0 0 15px rgba(88,166,255,0.1); border-radius: 4px;
      max-width: 100%; height: auto;
    }
    .grid-line { stroke: #1c2128; stroke-width: 8; }
    
    /* Khung bọc viền khi viết HOA toàn chữ */
    .caps-frame { fill: none; stroke: #c9d1d9; stroke-width: 20; display: none; }
    /* Vòng tròn "o" ở góc Dấu (Trên-Phải) khi viết Hoa chữ đầu */
    .title-frame { fill: none; stroke: #c9d1d9; stroke-width: 25; display: none; }

    /* Inputs */
    .inputs {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 10px; width: 100%; max-width: 380px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .input-row { display: flex; align-items: center; gap: 6px; }
    .input-row label { font-size: 11px; color: #8b949e; width: 68px; flex-shrink: 0; text-align: right; }
    .input-row input, .input-row select {
      flex: 1; padding: 6px 8px; min-width: 0;
      background: #0d1117; border: 1px solid #30363d;
      color: #c9d1d9; border-radius: 4px;
      font-size: 14px; font-family: monospace;
    }
    .input-row input:focus, .input-row select:focus { outline: none; border-color: #58a6ff; }
    #input-word { font-family: 'Segoe UI', sans-serif; text-align: center; font-size: 15px; }
    #input-b60  { color: #7ee787; letter-spacing: 0.3em; text-indent: 0.3em; font-size: 16px; text-align: center; }
    #input-time { color: #79c0ff; letter-spacing: 0.2em; text-indent: 0.2em; font-size: 14px; text-align: center; }

    /* Buttons Toolbar */
    .toolbar {
      display: flex; flex-direction: column; gap: 6px;
      width: 100%; max-width: 380px; margin-top: 4px;
    }
    .btn-group-tones {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px;
    }
    .btn-group-cases {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    button {
      background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
      padding: 8px 2px; border-radius: 6px; font-size: 11px;
      cursor: pointer; transition: all .15s; font-family: inherit;
      white-space: nowrap; text-align: center; outline: none;
      touch-action: manipulation;
    }
    .btn-group-cases button { padding: 8px 4px; font-size: 12px; }
    button:hover { background: #30363d; border-color: #8b949e; }
    button:active { background: #282e33; }
    button.active { background: #58a6ff; color: #000; border-color: #58a6ff; font-weight: bold; }
    
    #status { font-size: 11px; color: #8b949e; margin-top: 6px; text-align: center; }

    /* Legend */
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 12px; font-size: 10px; color: #8b949e; margin-top: 2px; }
    .legend span::before { content: '■ '; }
    .leg-pa   { color: #ff7b72; } .leg-pa::before   { color: #ff7b72; }
    .leg-van  { color: #7ee787; } .leg-van::before  { color: #7ee787; }
    .leg-dau  { color: #79c0ff; } .leg-dau::before  { color: #79c0ff; }
    .leg-mark { color: #ffd700; } .leg-mark::before { color: #ffd700; }
  </style>
</head>
<body>
  <h1>Base60 Block Typeface Generator</h1>
  <p>Cấu trúc 4 Khối: Dấu hình học trực quan & Tối ưu khoảng trống</p>

  <div class="displays" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 460px; margin-bottom: 10px;">
    <!-- Loại 0: Gốc -->
    <div class="variant" style="margin: 0; padding: 6px;">
      <div style="font-size: 10px; color: #58a6ff; font-weight: bold; margin-bottom: 4px;">0. Gốc (C3 ↖ | Dấu ↗)</div>
      <svg id="svg-type0" class="canvas" width="100%" viewBox="0 0 1000 1000">
        <line x1="500" y1="0" x2="500" y2="1000" class="grid-line" stroke-dasharray="16,16"/>
        <line x1="0" y1="500" x2="1000" y2="500" class="grid-line" stroke-dasharray="16,16"/>
      </svg>
    </div>

    <!-- Loại 1: Đảo trên -->
    <div class="variant" style="margin: 0; padding: 6px;">
      <div style="font-size: 10px; color: #ff7b72; font-weight: bold; margin-bottom: 4px;">1. Đảo Trên (Dấu ↖ | C3 ↗)</div>
      <svg id="svg-type1" class="canvas" width="100%" viewBox="0 0 1000 1000">
        <line x1="500" y1="0" x2="500" y2="1000" class="grid-line" stroke-dasharray="16,16"/>
        <line x1="0" y1="500" x2="1000" y2="500" class="grid-line" stroke-dasharray="16,16"/>
      </svg>
    </div>

    <!-- Loại 2: Dấu tại 6 vị trí quanh C1 C2 (Bỏ C3) -->
    <div class="variant" style="margin: 0; padding: 6px; grid-column: span 2;">
      <div style="font-size: 12px; color: #ffd700; font-weight: bold; margin-bottom: 4px; text-align: center;">2. Dấu 6 vị trí (Bỏ C3, mã hóa 2D không gian)</div>
      <svg id="svg-type2" class="canvas" width="100%" viewBox="0 0 1000 1000" style="max-height: 250px; display: block; margin: auto;">
        <rect x="200" y="250" width="600" height="500" fill="none" stroke="#1c2128" stroke-dasharray="8,8" stroke-width="4"/>
      </svg>
    </div>
  </div>

  <div style="font-size: 9px; color: #8b949e; margin-bottom: 8px; text-align: center; font-family: monospace;">
    Vị trí: 0:Trên-C1 &nbsp; 1:Trên-C2 &nbsp; 2:Góc-Trên-Phải &nbsp; 3:Bên-Phải &nbsp; 4:Góc-Dưới-Phải &nbsp; 5:Dưới-C2
  </div>


  <div class="inputs">
    <div class="input-row">
      <label>Phông chữ</label>
      <select id="sel-font">
        <option value="/Megrim.ttf">✨ Megrim (Siêu tối giản - Chữ A là ^, thanh mảnh)</option>
        <option value="/MajorMonoDisplay-Regular.ttf">✨ Major Mono (Kỷ nguyên tương lai, tối giản)</option>
        <option value="/Michroma-Regular.ttf">✨ Michroma (Phong cách NASA / Sci-fi)</option>
        <option value="/Wallpoet-Regular.ttf">✨ Wallpoet (Stencil tối giản)</option>
        <option value="/Plaster-Regular.ttf">✨ Plaster (Khối hình học tối giản)</option>
        <option value="/Rajdhani-Bold.ttf">Rajdhani (Vuông, Tương lai) - Mặc định</option>
        <option value="/ShareTechMono.ttf">Share Tech (Vuông, Tech)</option>
        <option value="/ChakraPetch-Bold.ttf">Chakra Petch (Bold, Cyber)</option>
        <option value="/SpaceMono-Bold.ttf">Space Mono (Geometric, Code)</option>
        <option value="/Audiowide-Regular.ttf">Audiowide (Cyber, Rộng)</option>
        <option value="/CutiveMono-Regular.ttf">Cutive Mono (Đánh chữ, Mảnh)</option>
        <option value="/VT323-Regular.ttf">VT323 (Pixel, Retro 8-bit)</option>
        <option value="/RobotoMono.ttf">Roboto Mono (Tròn trịa)</option>
      </select>
    </div>
    <div class="input-row">
      <label>Tiếng Việt</label>
      <input type="text" id="input-word" value="cào" placeholder="gõ từ tiếng Việt" />
    </div>
    <div class="input-row">
      <label>Mã Base60</label>
      <input type="text" id="input-b60" maxlength="4" placeholder="VD: oCpf" />
    </div>
    <div class="input-row">
      <label>Mã Time</label>
      <input type="text" id="input-time" maxlength="6" placeholder="VD: 112402" />
    </div>
  </div>

  <div class="toolbar">
    <div class="btn-group-tones" id="group-tone">
      <button onclick="setTone(0)" data-val="0">Ngang</button>
      <button onclick="setTone(1)" data-val="1">Sắc</button>
      <button onclick="setTone(2)" data-val="2">Huyền</button>
      <button onclick="setTone(3)" data-val="3">Hỏi</button>
      <button onclick="setTone(4)" data-val="4">Ngã</button>
      <button onclick="setTone(5)" data-val="5">Nặng</button>
    </div>
    <div class="btn-group-cases" id="group-case">
      <button onclick="setCase('LOWER')" data-val="LOWER">chữ thường</button>
      <button onclick="setCase('TITLE')" data-val="TITLE">chữ Hoa</button>
      <button onclick="setCase('ALL')" data-val="ALL">CHỮ HOA</button>
    </div>
  </div>

  <div id="status">Đang tải font...</div>

  <script type="module" src="./font-maker.js?v=7"></script>
</body>
</html>
