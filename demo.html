<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat App Demo</title>
    <!-- External modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="demo.css?v=">
    <link rel="stylesheet" href="snk.css?v=">
</head>
<body>
    <div class="phone-scale-wrapper">
        <div class="phone-container" style="min-height: 0;">
            <!-- Status Bar -->
            <div class="status-bar" id="statusBar">
                <div class="time" id="statusTime">09:41</div>
                <div class="icons">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
                    <svg width="24" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line></svg>
                </div>
            </div>

            <!-- Main App UI -->
            <main class="app-content" style="display: flex; flex-direction: column; background: #e5ddd5; padding: 0; flex: 1; min-height: 0;">
                <div class="app-header" style="background: #fff; border-bottom: 1px solid #eee; padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 10;">
                    <button style="background: none; border: none; font-size: 20px;">⬅️</button>
                    <div style="width: 36px; height: 36px; border-radius: 50%; background: #ccc; overflow: hidden;"><img src="https://ui-avatars.com/api/?name=Vinh&background=0D8ABC&color=fff" style="width: 100%; height: 100%; object-fit: cover;"></div>
                    <div style="flex: 1; min-height: 0;">
                        <div style="font-weight: 600; font-size: 16px;">Vinh</div>
                        <div style="font-size: 12px; color: #34C759;">Đang hoạt động</div>
                    </div>
                    <button style="background: none; border: none; font-size: 20px; color: var(--primary-color);">📞</button>
                </div>

                <div class="chat-messages" id="chatMessages" style="flex: 1; overflow-y: auto; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
                    <div style="align-self: center; background: #E1F3FB; padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #555;">Hôm nay</div>
                    
                    <div style="align-self: flex-start; max-width: 80%; background: #fff; padding: 10px 14px; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                        <div style="font-size: 14px; line-height: 1.4;">Ê mày, cái pass wifi phòng họp là gì ấy nhỉ?</div>
                        <div style="font-size: 10px; color: #999; text-align: right; margin-top: 4px;">09:41</div>
                    </div>
                    
                    <div class="chat-bubble user-bubble" style="align-self: flex-end; max-width: 80%; background: #E3FFC4; padding: 10px 14px; border-radius: 16px 16px 4px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative;">
                        <div style="font-size: 14px; line-height: 1.4;">Pass đây: 123456789</div>
                        <div style="font-size: 10px; color: #999; text-align: right; margin-top: 4px;">09:42</div>
                        <button class="chat-copy-btn" style="position: absolute; right: auto; left: -40px; top: 10px; background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">📋</button>
                    </div>
                    
                    <div style="align-self: flex-start; max-width: 80%; background: #fff; padding: 10px 14px; border-radius: 16px 16px 16px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1);">
                        <div style="font-size: 14px; line-height: 1.4;">Gửi tao số tài khoản luôn nhé.</div>
                        <div style="font-size: 10px; color: #999; text-align: right; margin-top: 4px;">09:43</div>
                    </div>
                    
                    <div class="chat-bubble user-bubble" style="align-self: flex-end; max-width: 80%; background: #E3FFC4; padding: 10px 14px; border-radius: 16px 16px 4px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative;">
                        <div style="font-size: 14px; line-height: 1.4;">Số TK: 1903456789 - VIB</div>
                        <div style="font-size: 10px; color: #999; text-align: right; margin-top: 4px;">09:45</div>
                        <button class="chat-copy-btn" style="position: absolute; right: auto; left: -40px; top: 10px; background: #fff; border: 1px solid #ddd; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">📋</button>
                    </div>
                </div>
                
                <div class="chat-input-area" style="background: #f0f0f0; padding: 8px; display: flex; align-items: center; gap: 8px; z-index: 10;">
                    <button style="background: none; border: none; font-size: 24px; color: #888;">😀</button>
                    <textarea id="demoInput" placeholder="Nhắn tin..." style="flex: 1; border: none; border-radius: 20px; padding: 12px 16px; font-size: 16px; resize: none; height: 60px; outline: none; background: #fff; font-family: inherit;"></textarea>
                    <button style="background: var(--primary-color); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg></button>
                </div>
            </main>

            <!-- Keyboard Container Placeholder -->
            

            <!-- Absolute overlay container for the sliding keyboard -->
            <div id="keyboardContainer" class="keyboard" targetid="demoInput" style="position: absolute; bottom: 0; left: 0; width: 100%; display: none; flex-direction: column; z-index: 100; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); transform: translateY(100%);">
            </div>
            
        </div>
    </div>

    <script type="module" src="vcomp.js?v="></script>
    <script type="module" src="data.js?v="></script>
    <script type="module" src="snk.js?v="></script>
    <script type="module" src="demo.js?v="></script>
</body>
</html>
